<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Mood Playlist Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Navigation Control -->
  <button id="backBtn" class="nav-btn hidden">← Back to Wheel</button>

  <div class="rainbow-wrapper" id="wrapper">
    <div class="center-glow" id="centerGlow"></div>
    <div class="rainbow-ring" id="ring"></div>
    <div class="keywords-container" id="keywordsContainer"></div>
  </div>

  <!-- Action Bar & Playlist Output -->
  <div class="playlist-section hidden" id="playlistSection">
    <button id="generateBtn" class="generate-btn">Generate Playlist</button>
    <div id="songList" class="song-list"></div>
  </div>

  <script src="app.js"></script>
</body>

</html>
